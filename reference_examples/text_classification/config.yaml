# Dataset split sizes — full datasets
dataset:
  num_train: 200
  num_val: 50
  num_test: 100
  overrides:
    # MCE tasks: use full official splits
    USPTO:                     {num_train: 50, num_val: 30, num_test: 100}
    Symptom2Disease:           {num_train: 200, num_val: 50, num_test: 212}
    LawBench:                  {num_train: 200, num_val: 50, num_test: 100}

# Inner loop settings
inner_loop:
  mode: offline      # "online" or "offline"
  num_epochs: 1      # For offline mode: 1 epoch for local server speed (was 5)
  temperature: 0.0   # LLM temperature (null = model default)
  eval_interval: 0   # 0 = no intermediate evals
  batch_size: 1
  seed: 42

# Models to test
models:
  # CS224V: local Ollama task model (no school API key). See local-llm/README.md.
  # Set TEXT_CLASSIFICATION_MAX_INFLIGHT to Ollama's parallel slots before running.
  - model: gpt-oss-20b
    api_base: http://localhost:11434/v1
  # Fast debugging model (weak on LawBench; pipeline tests only):
  # - model: qwen3.5-4b
  #   api_base: http://localhost:11434/v1
  # - model: gemini/gemini-3.1-flash-lite
  # - model: openrouter/openai/gpt-oss-120b
  # To use a custom OpenAI-compatible endpoint instead, switch to e.g.:
  # - model: gpt-oss-120b
  #   api_base: https://your-api-host/v1

# Benchmark sweep settings
benchmark:
  seeds: [42]              # multi-seed: [42, 123, 456]
  concurrency: 1           # CS224V: one job at a time; a single local GPU serves all calls

# Datasets to test
datasets:
  # CS224V proposal: LawBench (primary) + Symptom2Disease; USPTO excluded
  # - USPTO
  - Symptom2Disease
  - LawBench

# Memory systems to test
memory_systems:
  baselines:
    - no_memory
    - fewshot_all
  proposed: []  # meta_harness.py writes candidate files into agents/ at runtime
